name: Validate resilience lab

'on':
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  compose-and-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose model
        run: docker compose config --quiet

      - name: Lint shell scripts
        run: docker run --rm --entrypoint sh --volume "$PWD:/mnt:ro" koalaman/shellcheck-alpine:v0.10.0 -c 'shellcheck /mnt/scripts/*.sh /mnt/postgres/*/*.sh'

      - name: Start Kafka and PostgreSQL topology
        run: docker compose up --detach --wait --wait-timeout 240

      - name: Initialize lab resources
        run: ./scripts/bootstrap.sh

      - name: Verify quorum, messaging, and replication
        run: ./scripts/verify.sh

      - name: Exercise one-broker failure
        run: ./scripts/kafka-failure-drill.sh

      - name: Capture state on failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail=200

      - name: Tear down lab
        if: always()
        run: docker compose down --volumes --remove-orphans
