name: kafka-postgres-resilience-lab

x-kafka-environment: &kafka-environment
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT
  KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093,HOST://:9092
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 2
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_NUM_PARTITIONS: 3
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
  CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

x-kafka-service: &kafka-service
  image: apache/kafka:4.1.2
  restart: unless-stopped
  networks:
    - data-platform
  healthcheck:
    test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1"]
    interval: 10s
    timeout: 10s
    retries: 20
    start_period: 30s

services:
  kafka-1:
    <<: *kafka-service
    hostname: kafka-1
    ports:
      - "29092:9092"
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:19092,HOST://localhost:29092
    volumes:
      - kafka_1_data:/var/lib/kafka/data

  kafka-2:
    <<: *kafka-service
    hostname: kafka-2
    ports:
      - "39092:9092"
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:19092,HOST://localhost:39092
    volumes:
      - kafka_2_data:/var/lib/kafka/data

  kafka-3:
    <<: *kafka-service
    hostname: kafka-3
    ports:
      - "49092:9092"
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:19092,HOST://localhost:49092
    volumes:
      - kafka_3_data:/var/lib/kafka/data

  postgres-primary:
    image: postgres:17.10-alpine3.23
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-banking_app}
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-password}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:-local-replication-password}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - wal_keep_size=256MB
    volumes:
      - postgres_primary_data:/var/lib/postgresql/data
      - ./postgres/primary-init:/docker-entrypoint-initdb.d:ro
    networks:
      - data-platform
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  postgres-standby:
    image: postgres:17.10-alpine3.23
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB: ${POSTGRES_DB:-banking_app}
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-password}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:-local-replication-password}
    entrypoint: ["/usr/local/bin/standby-entrypoint.sh"]
    volumes:
      - postgres_standby_data:/var/lib/postgresql/data
      - ./postgres/standby/standby-entrypoint.sh:/usr/local/bin/standby-entrypoint.sh:ro
    depends_on:
      postgres-primary:
        condition: service_healthy
    networks:
      - data-platform
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

networks:
  data-platform:
    driver: bridge

volumes:
  kafka_1_data:
  kafka_2_data:
  kafka_3_data:
  postgres_primary_data:
  postgres_standby_data:

